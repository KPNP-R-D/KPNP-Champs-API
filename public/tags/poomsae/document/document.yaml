  /competitions/{competitionSeq}/documents/sub-list/{documentType}:
    get:
      summary: 대회 문서 서브 리스트 조회
      description: 선택한 문서 유형(documentType)에 따라 세부 이벤트 리스트를 조회한다.
      tags:
        - 문서
      parameters:
        - name: competitionSeq
          in: path
          required: true
          schema:
            type: integer
          description: 대회의 고유 식별자
        - name: documentType
          in: path
          required: true
          schema:
            type: string
            enum:
              - DRAW_SHEET_OR_START_LIST
              - CONTEST_RESULTS_OF_TOURNAMENT
              - CONTEST_RESULTS_OF_CUTOFF
              - ENTRIES_BY_DIVISION
              - SCHEDULES_BY_COURT
              - SESSION_SCHEDULES_BY_COURT
              - SESSION_SCHEDULES_BY_DAY
              - SESSION_SCHEDULES_BY_DAY_WITH_START_TIME
              - MEDAL_LISTS
          description: 조회할 문서 유형
      responses:
        '200':
          description: 서브 리스트 조회 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        day:
                          type: string
                          nullable: true
                          example: null
                          description: '일차'
                        sessionNumber:
                          type: integer
                          nullable: true
                          example: null
                          description: '세션 번호'
                        courtNumber:
                          type: integer
                          nullable: true
                          example: null
                          description: '코트 번호'
                        divisionType:
                          type: string
                          nullable: true
                          example: null
                          description: '대회 룰 코드 (이거를 문서 상세 조회 필요할때 넣어야함)'
                        divisionName:
                          type: string
                          nullable: true
                          example: null
                          description: '대회 룰 명'
                        departmentType:
                          type: string
                          nullable: true
                          example: UNDER_30
                          description: '대회 부 코드'
                        departmentName:
                          type: string
                          nullable: true
                          example: Under 30
                          description: '대회 부 명'
                        divisionCategoryType:
                          type: string
                          nullable: true
                          example: INDIVIDUAL_MALE
                          description: '대회유형 코드'
                        divisionCategoryName:
                          type: string
                          nullable: true
                          example: Individual male
                          description: '대회유형 명'
                        phaseType:
                          type: string
                          nullable: true
                          example: 'SF-A'
                          description: 'phase (상세 조회에 필요할때 이거 넣어야함)'
                        competitionEventSeq:
                          type: integer
                          nullable: true
                          example: 10570
                          description: '게임 코드 (상세 조회에 필요할때 이거 넣어야함)'
                        competitionMatchPsSeq:
                          type: integer
                          nullable: true
                          example: 49921
                          description: 'match seq (상세 조회에 필요할때 이거 넣어야함)'
                  error:
                    type: string
                    nullable: true
                    example: null

              examples:
                successResponse:
                  summary: 성공 응답
                  value:
                    success: true
                    data:
                      [
                        {
                          "day": null,
                          "sessionNumber": null,
                          "courtNumber": null,
                          "divisionType": null,
                          "divisionName": null,
                          "departmentType": null,
                          "departmentName": null,
