          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      poosaeList:
                        type: array
                        items:
                          type: object
                          properties:
                            poomsaeType:
                              type: string
                              example: "TAEGEUK_1_JANG"
                            nameEn:
                              type: string
                              example: "Taegeuk 1 Jang"
                            nameKo:
                              type: string
                              example: "태극 1장"
