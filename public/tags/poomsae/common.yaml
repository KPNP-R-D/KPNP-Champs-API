      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      matchStyles:
                        type: array
                        items:
                          type: object
                          properties:
                            poomsaeMatchStyleType:
                              type: string
                              example: "TOURNAMENT"
                            nameEn:
                              type: string
                              example: "Tournament"
                            nameKo:
                              type: string
                              example: "토너먼트"
