                            nameEn: "Cutoff"
                            nameKo: "컷오프"

                  error:
                    type: string
                    nullable: true
                    example: null

  /common/combo/draw-list:
    get:
      summary: 품새 추첨 방식 목록 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      drawList:
                        type: array
                        items:
                          type: object
                          properties:
                            poomsaeDrawType:
                              type: string
                              example: RANDOM
                              description: 품새 추첨 방식 코드
                            nameEn:
                              type: string
                              example: Random
                              description: 영어 이름
                            nameKo:
                              type: string
                              example: 무작위
                              description: 한국어 이름
                          example:
                            - poomsaeDrawType: RANDOM
                              nameEn: Random
                              nameKo: 무작위
                            - poomsaeDrawType: PIN_SELECT
                              nameEn: PinSelect
                              nameKo: 고정선택
                            - poomsaeDrawType: REFEREE_SELECT
