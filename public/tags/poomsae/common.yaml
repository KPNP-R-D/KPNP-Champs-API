                            nameKo: "태극 1장"
                          - poomsaeType: "TAEGEUK_2_JANG"
                            nameEn: "Taegeuk 2 Jang"
                            nameKo: "태극 2장"
                          - poomsaeType: "TAEGEUK_3_JANG"
                            nameEn: "Taegeuk 3 Jang"
                            nameKo: "태극 3장"
                          - poomsaeType: "TAEGEUK_4_JANG"
                            nameEn: "Taegeuk 4 Jang"
                            nameKo: "태극 4장"
                          - poomsaeType: "KORYO"
                            nameEn: "Koryo"
                            nameKo: "고려"
                          - poomsaeType: "HANSU"
                            nameEn: "Hansu"
                            nameKo: "한수"
                  error:
                    type: string
                    nullable: true
                    example: null

  /common/combo/composite-rate-list:
    get:
      summary: 품새 항목 조회
