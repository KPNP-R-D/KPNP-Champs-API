                    type: string
                    nullable: true
                    example: null

  /common/combo/match-orders:
    get:
      summary: 품새 시연 순서 목록
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      matchOrders:
