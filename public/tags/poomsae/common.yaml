                    type: object
                    nullable: true
                    example: null

  /common/combo/participant-order-status-list:
    get:
      summary: 참가자 결제 상태 리스트 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      participantOrderStatusList:
                        type: array
                        items:
                          type: object
                          properties:
                            participantOrderStatusCode:
                              type: string
                              example: 01, 02, 10, 12
                              description: 결제 상태 코드
                            nameKo:
                              type: string
                              example: 입금 전
                              description: 결제 상태 국문명
                            nameEn:
                              type: string
                              example: Before payment
                              description: 결제 상태 영문명
                          example:
                            - participantOrderStatusCode: "01"
                              nameKo: 입금 전
                              nameEn: Before payment
                            - participantOrderStatusCode: "02"
                              nameKo: 입금 확인
                              nameEn: Payment confirmed
                            - participantOrderStatusCode: "10"
                              nameKo: 참가 실패
                              nameEn: Participant failed
                            - participantOrderStatusCode: "12"
                              nameKo: 환불 요청
                              nameEn: Refund requested
                  error:
                    type: object
                    nullable: true
                    example: null

  /competition/{competitionSeq}/all-event-filter:
    get:
      summary: 참여 선수 상관없이 저장한 경기의 부 별 정보의 필터
      tags:
        - 공통
      parameters:
        - name: competitionSeq
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: 계층 키
                          example: divisionCode
                        code:
                          type: string
                          description: 코드 값
                          example: OPEN_RECOGNIZED_POOMSAE
                        name:
                          type: string
                          description: 이름(영문|한글)
                          example: Open Recognized Poomsae|오픈대회 공인품새
                        nextDepth:
                          type: array
                          items:
                            type: object
                            properties:
                              key:
                                type: string
                                description: 다음 계층 키
                                example: departmentCode
                              code:
                                type: string
                                description: 코드 값
                                example: Under30
                              name:
                                type: string
                                description: 이름
                                example: Under30
                              nextDepth:
                                type: array
                                items:
                                  type: object
                                  properties:
                                    key:
                                      type: string
                                      description: 다음 계층 키
                                      example: divisionCategoryCode
                                    code:
                                      type: string
                                      description: 코드 값
                                      example: INDIVIDUAL_MALE
                                    name:
                                      type: string
                                      description: 이름(영문|한글)
                                      example: Individual male|남자개인
                                  example:
                                    - key: divisionCategoryCode
                                      code: INDIVIDUAL_MALE
                                      name: Individual male|남자개인
                                    - key: divisionCategoryCode
                                      code: INDIVIDUAL_FEMALE
                                      name: Individual female|여자개인
                            example:
                              - key: departmentCode
                                code: Under30
                                name: Under30
                                nextDepth:
                                  - key: divisionCategoryCode
                                    code: INDIVIDUAL_MALE
                                    name: Individual male|남자개인
                                  - key: divisionCategoryCode
                                    code: INDIVIDUAL_FEMALE
                                    name: Individual female|남자개인
                      example:
                        - key: divisionCode
                          code: OPEN_RECOGNIZED_POOMSAE
                          name: Open Recognized Poomsae|오픈대회 공인품새
                          nextDepth:
                            - key: departmentCode
                              code: Under30
                              name: Under30
                              nextDepth:
                                - key: divisionCategoryCode
                                  code: INDIVIDUAL_MALE
                                  name: Individual male|남자개인
                                - key: divisionCategoryCode
                                  code: INDIVIDUAL_FEMALE
                                  name: Individual female|여자개인
                        - key: divisionCode
                          code: WT_RECOGNIZED_POOMSAE
                          name: WT Recognized Poomsae|WT 공인품새룰
                          nextDepth:
                            - key: departmentCode
                              code: UNDER_30
                              name: Under 30|30세 이하
                              nextDepth:
                                - key: divisionCategoryCode
                                  code: INDIVIDUAL_MALE
                                  name: Individual male|남자개인
                                - key: divisionCategoryCode
                                  code: INDIVIDUAL_FEMALE
                                  name: Individual female|남자개인
                                - key: divisionCategoryCode
                                  code: TEAM_MALE
                                  name: Team male|남자단체
                  error:
                    type: object
                    nullable: true
                    example: null

