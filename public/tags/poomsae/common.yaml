  /common/combo/bank-list:
    get:
      summary: 은행 목록 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      bankList:
                        type: array
                        items:
                          type: object
                          properties:
                            codeDetailNo:
                              type: string
                              example: BKCHCNBJ
                              description: 은행 코드
                            codeDetailName:
                              type: string
                              example: BankOfChina
                              description: 은행 영문명
                            description:
                              type: string
                              example: 중국은행
                              description: 은행 한글 설명
                            subCodeNo:
                              type: string
                              example: CN
                              description: 국가 코드
                          example:
                            - codeDetailNo: BKCHCNBJ
                              codeDetailName: BankOfChina
                              description: 중국은행
                              subCodeNo: CN
                            - codeDetailNo: ICBKCNBJ
                              codeDetailName: Industrial and Commercial Bank of China
                              description: 중국공상은행
                              subCodeNo: CN
                            - codeDetailNo: PBOCCNBJ
                              codeDetailName: Peoples Bank of China
                              description: 중국인민은행
                              subCodeNo: CN
                            - codeDetailNo: SHBKKRSEXXX
                              codeDetailName: ShinhanBank
                              description: 신한은행
                              subCodeNo: KR
                  error:
                    type: object
                    nullable: true
                    example: null

  /common/combo/application-path-list:
    get:
      summary: 참가 수단 목록 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      applicationPathList:
                        type: array
                        items:
                          type: object
                          properties:
                            applicationPathType:
                              type: string
                              example: C, I, A
                              description: 참가 수단 타입
                            nameKo:
                              type: string
                              example: CSV 추가
                              description: 참가 수단 타입에 해당하는 국문명
                            nameEn:
                              type: string
                              example: Add CSV
                              description: 참가 수단 타입에 해당하는 영문명
                          example:
                            - applicationPathType: C
                              nameKo: CSV 추가
                              nameEn: Add CSV
                            - applicationPathType: I
                              nameKo: 온라인
                              nameEn: Online
                            - applicationPathType: A
                              nameKo: 관리자 추가
                              nameEn: Add admin
