  /common/competition/{competitionSeq}/operation/cutoff-rtds-filter:
    get:
      summary: 컷오프 RTDS 표출 그룹 설정 필터
      description: |
        컷오프 RTDS 표출 그룹 설정 모달의 필터 데이터를 내려준다.
        대진 확정(매치번호 부여)된 **컷오프** 경기 기준으로
        룰 → 부 → 대회유형 → 강수 → 그룹 5단계 트리를 만든다. 완료된 그룹도 포함한다.

        - 강수(phase)·그룹(cutoffGroup) depth는 표시명 정본이 없어 `name`/`nameEn`에 코드값을 그대로 내려준다 (PRE/SF/F, A/B/C).
        - F(결승) 강수는 그룹이 없으므로 `nextDepth`가 생략된다.
        - 컷오프 경기가 하나도 없으면 빈 배열 — 프론트는 "표출할 정보가 없습니다" 안내창을 띄운다.
      tags:
        - 공통
      parameters:
        - name: competitionSeq
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    description: 5단계 필터 트리 (divisionCode → departmentCode → divisionCategoryCode → phase → cutoffGroup)
                    items:
                      type: object
                      properties:
                        key:
                          type: string
                          description: 계층 키 (divisionCode | departmentCode | divisionCategoryCode | phase | cutoffGroup)
                          example: divisionCode
                        code:
                          type: string
                          description: 코드 값
                          example: WT_RECOGNIZED_POOMSAE
                        name:
                          type: string
                          description: 이름(국문) — phase·cutoffGroup은 코드값 그대로
                          example: WT 공인품새룰
                        nameEn:
                          type: string
                          description: 이름(영문) — phase·cutoffGroup은 코드값 그대로
                          example: WT Recognized Poomsae
                        nextDepth:
                          type: array
                          description: 다음 계층 (동일 구조 재귀 — 마지막 계층은 생략)
                          items:
                            type: object
              examples:
                defaultResponse:
                  summary: 성공 응답 예시
                  value:
                    success: true
                    data:
                      - key: divisionCode
                        code: WT_RECOGNIZED_POOMSAE
                        name: WT 공인품새룰
                        nameEn: WT Recognized Poomsae
                        nextDepth:
                          - key: departmentCode
                            code: CADET
                            name: 유소년부
                            nameEn: Cadet
                            nextDepth:
                              - key: divisionCategoryCode
                                code: INDIVIDUAL_MALE
                                name: 남자개인
                                nameEn: Individual male
                                nextDepth:
                                  - key: phase
                                    code: PRE
                                    name: PRE
                                    nameEn: PRE
                                    nextDepth:
                                      - key: cutoffGroup
                                        code: A
                                        name: A
                                        nameEn: A
                                      - key: cutoffGroup
                                        code: B
                                        name: B
                                        nameEn: B
                                  - key: phase
                                    code: SF
                                    name: SF
                                    nameEn: SF
                                    nextDepth:
                                      - key: cutoffGroup
                                        code: A
                                        name: A
                                        nameEn: A
                                  - key: phase
                                    code: F
                                    name: F
                                    nameEn: F
                    error: null
        '403':
          description: 권한 없음
          content:
            application/json:
              schema:
                $ref: '../../components/responses.yaml#/Error'
              examples:
                IS_NOT_AUTHORIZED:
                  $ref: '../../components/examples.yaml#/IS_NOT_AUTHORIZED'

  /common/competition/{competitionSeq}/matches/{competitionMatchPsSeq}/results:
    get:
      summary: 운영 - 경기 스타일별 결과 리스트 조회
      description: |
        운영 경기에 사용할 경기 스타일에 따른 결과 리스트를 조회한다.
      tags:
        - 공통
      parameters:
        - name: competitionSeq
          in: path
          required: true
          schema:
            type: integer
          description: 대회 고유 시퀀스
        - name: competitionMatchPsSeq
          in: path
          required: true
          schema:
            type: integer
          description: 경기 고유 시퀀스
      responses:
        '200':
          description: 경기 결과 리스트를 성공적으로 조회한 경우
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required:
                      - competitionMatchPsSeq
                      - matchStyleType
                      - winnerMatchSideTypes
                      - resultDecisionTypes
                    properties:
                      competitionMatchPsSeq:
                        type: integer
                        description: 경기 고유 시퀀스
                      matchStyleType:
                        type: string
                        description: "경기 스타일 타입 (예: CUTOFF, TOURNAMENT)"
                      winnerMatchSideTypes:
                        type: array
                        description: 승자 쪽 정보 목록 (토너먼트일 경우에만 값 존재)
                        items:
                          type: object
                          properties:
                            matchSideType:
                              type: string
                              description: 경기 편측 타입 (HOME, AWAY)
                            matchSideTypeNameEn:
                              type: string
                              description: 경기 편측 영문명
                            matchSideTypeNameKo:
                              type: string
                              description: 경기 편측 한글명
                      resultDecisionTypes:
                        type: array
                        description: 결과 판정 타입 목록
                        items:
                          type: object
                          properties:
                            resultDecisionType:
                              type: string
                              description: 결과 판정 타입 코드
                            resultDecisionTypeNameEn:
                              type: string
                              description: 결과 판정 영문명
                            resultDecisionTypeNameKo:
                              type: string
                              description: 결과 판정 한글명
                  error:
                    type: string
                    nullable: true
              examples:
                cutoffResponse:
                  summary: 컷오프 스타일 예시
