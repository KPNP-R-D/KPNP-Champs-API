paths:
  /common/combo/rules:
    get:
      summary: 품새 대회룰 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공적으로 조회된 응답
          content:
            application/json:
              examples:
                divisionRulesExample:
                  summary: example
                  value:
                    success: true
                    data:
                      rules:
                        - poomsaeDivisionType: WT_RECOGNIZED_POOMSAE
                          nameEn: WT Recognized Poomsae
                          nameKo: WT 공인품새룰
                        - poomsaeDivisionType: FREE_STYLE_POOMSAE
                          nameEn: Free Style Poomsae
                          nameKo: 자유품새룰
                        - poomsaeDivisionType: MIXED_POOMSAE
                          nameEn: Mixed Poomsae
                          nameKo: 복합품새룰
                        - poomsaeDivisionType: KVR_RECOGNIZED_POOMSAE
                          nameEn: KVR Recognized Poomsae
                          nameKo: 한국 공인품새룰
                        - poomsaeDivisionType: OPEN_RECOGNIZED_POOMSAE
                          nameEn: Open Recognized Poomsae
                          nameKo: 오픈대회 공인품새
                        - poomsaeDivisionType: OPEN_FREE_STYLE_POOMSAE
                          nameEn: Open Free Style Poomsae
                          nameKo: 오픈대회 자유품새
                    error: null

  /common/combo/timezones:
    get:
      summary: 타임존 리스트 저장
      tags:
        - 공통
      responses:
        '200':
          description: 성공적으로 조회된 응답
          content:
            application/json:
              examples:
                divisionRulesExample:
                  summary: example
                  value:
                    success: true
                    data:
                      [
                        {
                          "value": "Europe/Andorra",
                          "cityName": "Andorra",
                          "countryName": "Andorra"
                        },
                        {
                          "value": "Asia/Dubai",
                          "cityName": "Dubai",
                          "countryName": "United Arab Emirates"
                        },
                        {
                          "value": "Asia/Kabul",
                          "cityName": "Kabul",
                          "countryName": "Afghanistan"
                        },
                      ]
                    error: null

  /common/combo/countries:
    get:
      summary: 국가 조회 (+연락처)
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      countries:
                        type: array
                        items:
#                          $ref: '../../components/schemas.yaml#/Country'
                          $ref: '../../components/schemas.yaml#/Country'
              example:
                success: true
                data:
                  countries:
                    - codeDetailNo: "AF"
                      codeDetailName: "(+93) Afghanistan"
                    - codeDetailNo: "AL"
                      codeDetailName: "(+355) Albania"
                    - codeDetailNo: "DZ"
                      codeDetailName: "(+213) Algeria"
                    - codeDetailNo: "AS"
                      codeDetailName: "(+1-684) American Samoa"
                    - codeDetailNo: "AD"
                      codeDetailName: "(+376) Andorra"
                    - codeDetailNo: "AO"
                      codeDetailName: "(+244) Angola"
                    - codeDetailNo: "AI"
                      codeDetailName: "(+1-264) Anguilla"
                    - codeDetailNo: "AQ"
                      codeDetailName: "(+672) Antarctica"
                    - codeDetailNo: "AG"
                      codeDetailName: "(+1-268) Antigua and Barbuda"
                    - codeDetailNo: "AR"
                      codeDetailName: "(+54) Argentina"
                    - codeDetailNo: "AM"
                      codeDetailName: "(+374) Armenia"
                    - codeDetailNo: "AW"
                      codeDetailName: "(+297) Aruba"
                    - codeDetailNo: "AU"
                      codeDetailName: "(+61) Australia"
                    - codeDetailNo: "AT"
                      codeDetailName: "(+43) Austria"
                    - codeDetailNo: "AZ"
                      codeDetailName: "(+994) Azerbaijan"

  /common/combo/noc-list:
    get:
      summary: 국가 조회 (+표준시간)
      tags:
        - 공통
      responses:
        '200':
          description: 성공적으로 NOC 리스트 반환
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      nocList:
                        type: array
                        items:
                          type: object
                          properties:
                            code:
                              type: string
                              example: "KSA"
                            nameEn:
                              type: string
                              example: "Saudi Arabia"
                            utcInfo:
                              type: string
                              example: "(UTC +03:00)"
                        example:
                          - code: "KSA"
                            nameEn: "Saudi Arabia"
                            utcInfo: "(UTC +03:00)"
                          - code: "LAT"
                            nameEn: "Latvia"
                            utcInfo: "(UTC +02:00)"
                          - code: "LBA"
                            nameEn: "Libya"
                            utcInfo: "(UTC +02:00)"
                          - code: "MAD"
                            nameEn: "Madagascar"
                            utcInfo: "(UTC +03:00)"
                          - code: "MAS"
                            nameEn: "Malaysia"
                            utcInfo: "(UTC +08:00)"
                  error:
                    type: string
                    example: null
                    nullable: true

  /common/combo/wt-grades:
    get:
      summary: WT Grades 조회
      tags:
        - 공통
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      poomsaeWTGradeTypeList:
                        type: array
                        items:
                          type: string
                        example: [ "G1", "G2", "G4", "G6", "G8", "G10" ]
                  error:
                    type: string
                    nullable: true
                    example: null

  /common/combo/poomsae-list:
    get:
      summary: 품새 항목 조회
